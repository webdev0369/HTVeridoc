# Railway config for the Web service only.
# In Railway: Settings → Config-as-code → file path = railway.web.toml
# Set NEXT_PUBLIC_API_URL (with https://) on the service before building.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"

[deploy]
# Must not use npm/pnpm: the runner image has no package manager (node only).
# Do not set a publish directory — Next.js standalone server, not a static site.
startCommand = "node apps/web/server.js"
# `/` redirects to /dashboard (307) — Railway healthchecks require 2xx.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
