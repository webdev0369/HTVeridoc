# Example Railway config for the API service.
# Create separate Railway services for: Postgres, Redis, API, Web.
# Attach a persistent volume to the API at STORAGE_ROOT (e.g. /data/storage).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 40
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
