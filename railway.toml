# Example Railway config for the API service.
# Create separate Railway services for: Postgres, Redis, API, Web.
# Attach a persistent volume to the API at STORAGE_ROOT (e.g. /data/storage).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Must not use pnpm: the runner image has no package manager (node only).
# Also clears any Railway UI / Nixpacks start command that would override the image ENTRYPOINT.
startCommand = "/entrypoint.sh"
healthcheckPath = "/health"
# Free/hobby: serverless cold start + Postgres wake + migrations need headroom.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
