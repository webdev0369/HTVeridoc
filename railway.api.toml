# Railway config for the API service only.
# Do NOT name this railway.toml — Railway auto-applies root railway.toml to every
# service and would build the API image for @htveridoc/web (healthcheck / fails).
#
# In Railway: Settings → Config-as-code → file path = railway.api.toml
# Attach a persistent volume to the API at STORAGE_ROOT (e.g. /data/storage) when available.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Must not use pnpm: the runner image has no package manager (node only).
startCommand = "/entrypoint.sh"
healthcheckPath = "/health"
# Free/hobby: serverless cold start + Postgres wake + migrations need headroom.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
